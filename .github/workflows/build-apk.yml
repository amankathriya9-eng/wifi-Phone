name: Build WiFi Phone APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # 1. Get project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Linux packages
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # 5. Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Compatibility path
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          echo "Accepting Android licenses..."

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "Installing Android packages..."

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "===== SDK INSTALLED ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed

          echo "===== CHECK AIDL ====="

          test -f \
            "$SDK/build-tools/37.0.0/aidl"

          "$SDK/build-tools/37.0.0/aidl" --version

          echo "AIDL OK"

      # 6. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/kivy/buildozer.git

          pip install \
            legacy-cgi \
            setuptools \
            cython==0.29.34

      # 7. Configure buildozer.spec
      - name: Configure Buildozer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")

          if not p.exists():
              raise SystemExit("ERROR: buildozer.spec not found")

          text = p.read_text()

          # Remove old settings
          text = re.sub(
              r"(?m)^\s*android\.accept_sdk_license\s*=.*\n?",
              "",
              text
          )

          text = re.sub(
              r"(?m)^\s*p4a\.branch\s*=.*\n?",
              "",
              text
          )

          # Add settings inside [app]
          match = re.search(
              r"(?m)^\[app\]\s*$",
              text
          )

          if not match:
              raise SystemExit(
                  "ERROR: [app] section missing"
              )

          settings = """[app]

android.accept_sdk_license = True
p4a.branch = develop
"""

          text = (
              text[:match.start()]
              + settings
              + text[match.end():]
          )

          p.write_text(text)

          print("===== BUILD CONFIG =====")
          print(text)
          PY

      # 8. Tell Buildozer exactly where SDK/NDK are
      - name: Configure Android paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")
          text = p.read_text()

          # Remove existing path settings
          text = re.sub(
              r"(?m)^\s*android\.sdk_path\s*=.*\n?",
              "",
              text
          )

          text = re.sub(
              r"(?m)^\s*android\.ndk_path\s*=.*\n?",
              "",
              text
          )

          # Add inside [app]
          text = text.replace(
              "android.accept_sdk_license = True",
              """android.accept_sdk_license = True
android.sdk_path = /home/runner/android-sdk
android.ndk_path = /home/runner/android-sdk/ndk/27.2.12479018"""
          )

          p.write_text(text)

          print("Android paths configured.")
          PY

          grep -E \
            "android.sdk_path|android.ndk_path|android.accept_sdk_license|p4a.branch" \
            buildozer.spec

      # 9. Clean old Buildozer cache
      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

          mkdir -p ~/.buildozer/android/platform

          ln -s \
            "$ANDROID_SDK_ROOT" \
            ~/.buildozer/android/platform/android-sdk

      # 10. Final SDK verification
      - name: Verify SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager

          sdkmanager --version

          echo "Checking AIDL..."

          test -f \
            "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --version

          echo "SDK AND AIDL READY"

      # 11. Build APK
      - name: Build APK
        run: |
          buildozer android debug

      # 12. Find APK
      - name: Verify APK
        shell: bash
        run: |
          echo "=============================="
          echo "       APK BUILD RESULT"
          echo "=============================="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find bin \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK CREATED SUCCESSFULLY:"
          echo "$APK"

      # 13. Give APK to user
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Phone-APK
          path: bin/*.apk
          if-no-files-found: error
