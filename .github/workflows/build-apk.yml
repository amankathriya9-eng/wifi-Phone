name: Build WiFi Phone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install current Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools cython==0.29.34

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          if "android.accept_sdk_license" in text:
              import re
              text = re.sub(
                  r"(?m)^#?\s*android\.accept_sdk_license\s*=.*$",
                  "android.accept_sdk_license = True",
                  text
              )
          else:
              text += "\nandroid.accept_sdk_license = True\n"

          if "p4a.branch" in text:
              import re
              text = re.sub(
                  r"(?m)^#?\s*p4a\.branch\s*=.*$",
                  "p4a.branch = develop",
                  text
              )
          else:
              text += "\np4a.branch = develop\n"

          p.write_text(text)
          PY

          echo "===== BUILD CONFIG ====="
          grep -E "android.api|android.ndk|android.accept_sdk_license|p4a.branch|requirements" buildozer.spec || true

      - name: Download and prepare Android SDK/NDK
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Phone-APK
          path: bin/*.apk
          if-no-files-found: error
