name: Build WiFi Phone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:

      # -----------------------------
      # 1. Checkout source
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # 3. Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # 4. Linux dependencies
      # -----------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # -----------------------------
      # 5. Install Android SDK
      # -----------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O android-cmdline-tools.zip

          unzip -q android-cmdline-tools.zip

          rm -rf "$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Buildozer/p4a compatibility path
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          # Accept ALL Android licenses
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Install required Android components
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"

          # Accept licenses again after installation
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "===== ANDROID SDK ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

          echo "===== INSTALLED PACKAGES ====="

          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed

          echo "===== AIDL CHECK ====="

          test -f "$SDK/build-tools/37.0.0/aidl"

          "$SDK/build-tools/37.0.0/aidl" --version

          echo "AIDL OK"

      # -----------------------------
      # 6. Install Buildozer
      # -----------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install \
            git+https://github.com/kivy/buildozer.git

          pip install \
            legacy-cgi \
            setuptools \
            cython==0.29.34

      # -----------------------------
      # 7. Configure buildozer.spec
      # -----------------------------
      - name: Configure Buildozer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")

          if not p.exists():
              raise SystemExit("buildozer.spec not found")

          text = p.read_text()

          # Remove old values
          text = re.sub(
              r"(?m)^\s*android\.accept_sdk_license\s*=.*\n?",
              "",
              text
          )

          text = re.sub(
              r"(?m)^\s*p4a\.branch\s*=.*\n?",
              "",
              text
          )

          # Find [app]
          match = re.search(r"(?m)^\[app\]\s*$", text)

          if not match:
              raise SystemExit("[app] section not found")

          insert = (
              "[app]\n\n"
              "android.accept_sdk_license = True\n"
              "p4a.branch = develop"
          )

          text = text[:match.start()] + insert + text[match.end():]

          p.write_text(text)

          print("===== FINAL BUILD CONFIG =====")
          print(p.read_text())
          PY

      # -----------------------------
      # 8. Clean Buildozer cache
      # -----------------------------
      - name: Clean Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

          mkdir -p ~/.buildozer/android/platform

          ln -s \
            "$ANDROID_SDK_ROOT" \
            ~/.buildozer/android/platform/android-sdk

      # -----------------------------
      # 9. Verify SDK
      # -----------------------------
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          which sdkmanager

          sdkmanager --version

          test -f "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --version

      # -----------------------------
      # 10. Build APK
      # -----------------------------
      - name: Build APK
        run: |
          buildozer android debug

      # -----------------------------
      # 11. Verify APK
      # -----------------------------
      - name: Verify APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find bin \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK CREATED:"
          echo "$APK"

      # -----------------------------
      # 12. Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Phone-APK
          path: bin/*.apk
          if-no-files-found: error
