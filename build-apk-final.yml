name: Build WiFi Phone APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install current Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install legacy-cgi setuptools cython==0.29.34

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools"

          # Remove any incomplete/stale Buildozer SDK.
          rm -rf "$SDK/cmdline-tools/latest"
          rm -rf "$SDK/cmdline-tools/cmdline-tools"

          # Install modern Android command-line tools.
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"

          # Compatibility path used by older Buildozer/p4a versions.
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          # Install the exact tools needed by this project, including the
          # build-tools version that the failing build requested.
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018"

          yes | sdkmanager --licenses >/dev/null || true

          echo "===== SDK CHECK ====="
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|build-tools;35.0.0|build-tools;37.0.0|ndk;27.2.12479018" || true

          echo "===== AIDL CHECK ====="
          test -x "$SDK/build-tools/37.0.0/aidl"
          "$SDK/build-tools/37.0.0/aidl" --version

      - name: Configure Buildozer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("buildozer.spec")
          text = p.read_text()

          # Remove any previous copies so there is only one authoritative setting.
          text = re.sub(
              r"(?m)^\s*android\.accept_sdk_license\s*=.*\n?",
              "",
              text
          )
          text = re.sub(
              r"(?m)^\s*p4a\.branch\s*=.*\n?",
              "",
              text
          )

          # Keep the settings inside [app], where Buildozer reads them.
          marker = "[app]"
          if marker not in text:
              raise SystemExit("buildozer.spec does not contain [app]")

          text = text.replace(
              marker,
              marker + "\n\nandroid.accept_sdk_license = True\np4a.branch = develop",
              1
          )

          p.write_text(text)
          PY

          echo "===== BUILD CONFIG ====="
          grep -E \
            "android.api|android.ndk|android.accept_sdk_license|p4a.branch|requirements" \
            buildozer.spec

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/build
          mkdir -p ~/.buildozer/android/platform
          ln -sfn "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk

      - name: Verify Android SDK before Buildozer
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          command -v sdkmanager
          sdkmanager --version
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Phone-APK
          path: bin/*.apk
          if-no-files-found: error
