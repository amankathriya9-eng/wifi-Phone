name: Build WiFi Phone APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          echo 'IyBXaUZpIFBob25lOiBubyBjdXN0b20gUHJvR3VhcmQgcnVsZXMgcmVxdWlyZWQuCg==' | base64 -d > 'app/proguard-rules.pro'
          mkdir -p "$(dirname 'app/src/main/java/com/aman/wifiphone/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/com/aman/wifiphone/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/assets/index.html')"
          echo '' | base64 -d > 'app/src/main/assets/index.html'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'README.md')"
          echo '' | base64 -d > 'README.md'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Phone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
